services:
  - type: web
    name: partegeur
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 4 --timeout 120 partegeur:app
    plan: free
    disk:
      name: partegeur-data
      mountPath: /opt/render/project/src
      sizeGB: 1
